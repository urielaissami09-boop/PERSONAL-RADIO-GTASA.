name: Build PERSONAL RADIO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Compile PERSONAL RADIO for GTA SA Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download AML mod support sources
        run: |
          curl -fL https://github.com/RusJJ/AndroidModLoader/archive/refs/heads/main.zip -o aml.zip
          unzip -q aml.zip
          cp -a AndroidModLoader-main/mod ./mod

      - name: Download GTA San Andreas Android SDK headers
        run: |
          git clone --depth 1 https://github.com/AndroidModLoader/aml-psdk-gtasa.git aml-psdk-gtasa
          test -f aml-psdk-gtasa/aml-psdk/game_sa/Events.h
          test -f aml-psdk-gtasa/aml-psdk/game_sa/engine/Font.h
          test -f aml-psdk-gtasa/aml-psdk/game_sa/engine/Sprite2d.h

      - name: Download BASSMod source
        run: |
          curl -fL https://github.com/AndroidModLoader/BASSMod/archive/refs/heads/main.zip -o bassmod.zip
          unzip -q bassmod.zip
          mv BASSMod-main BASSMod
          cp BASSMod/ibass.h ./ibass.h
          cp -a AndroidModLoader-main/mod BASSMod/mod
          sed -i 's/^APP_ABI :=.*/APP_ABI := armeabi-v7a/' BASSMod/Application.mk
          test -s ibass.h

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1.2.0
        with:
          ndk-version: r24
          local-cache: true

      - name: Compile matching BASSMod dependency
        run: |
          cd BASSMod
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0 -j2
          test -s libs/armeabi-v7a/libBASSMod.so

      - name: Compile PERSONAL RADIO
        run: |
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0 -j2

      - name: Verify and package
        run: |
          test -s libs/armeabi-v7a/libPersonalRadio.so
          mkdir -p release
          cp libs/armeabi-v7a/libPersonalRadio.so release/
          cp BASSMod/libs/armeabi-v7a/libBASSMod.so release/
          cp README_ES.md README_COMPILACION.md release/
          cat > release/INSTALACION.txt <<'TXT'
          PERSONAL RADIO 0.3.6

          INSTALA SOLO ESTOS DOS ARCHIVOS:
          - libPersonalRadio.so
          - libBASSMod.so

          Copialos directamente en la carpeta mods de AML para GTA San Andreas.
          No copies los README ni este documento dentro de mods.

          El panel aparece arriba, en el centro. Tiene tres botones:
          << pista anterior, > reproducir/reanudar, || pausar, >> pista siguiente.
          Puedes arrastrar el panel con el dedo para cambiarlo de lugar.
          Los toques fuera del panel no deben activar la radio.

          Todavia no aparece en el selector original de emisoras.
          AML debe estar instalado y activo.
          TXT
          cat > release/VERSION.txt <<'TXT'
          PERSONAL RADIO 0.3.6
          GTA San Andreas Android 2.00
          ABI: armeabi-v7a
          Build: GitHub Actions
          TXT
          cd release
          zip -9 ../PERSONAL_RADIO_ANDROID.zip ./*
          file ../PERSONAL_RADIO_ANDROID.zip

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: PERSONAL_RADIO_ANDROID
          path: PERSONAL_RADIO_ANDROID.zip
          if-no-files-found: error
          retention-days: 30
